# Run the frozen release benchmarks every night against the live services.
# Skips cleanly (green, with a notice) when no API key secret is configured.
name: Nightly benchmarks

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rocto
        run: python -m pip install .
      - name: Run benchmarks/cases.json
        id: batch
        env:
          ROCTO_API_KEY: ${{ secrets.ROCTO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ROCTO_API_BASE: ${{ vars.ROCTO_API_BASE }}
          ROCTO_DEEPSEEK_MODEL: ${{ vars.ROCTO_DEEPSEEK_MODEL }}
          ROCTO_HOME: ${{ runner.temp }}/rocto-home
        run: |
          if [ -z "$ROCTO_API_KEY$DEEPSEEK_API_KEY" ]; then
            echo "::notice title=Benchmarks skipped::No DEEPSEEK_API_KEY or ROCTO_API_KEY secret is configured."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          set +e
          rocto batch benchmarks/cases.json --planner api --executor deepseek \
            --min-verified 4 --output-root benchmark-runs
          status=$?
          set -e
          cat benchmark-runs/batch-*/summary.md >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '```'; rocto stats || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the runs
        if: always() && steps.batch.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runs
          path: benchmark-runs
          include-hidden-files: true
          retention-days: 30
