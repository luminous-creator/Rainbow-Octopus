name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem dist\*.whl | Select-Object -First 1)
          rocto --version
          rocto --help

  portable-browser:
    name: Browser loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a discoverable host browser
        env:
          PYTHONPATH: src
        run: python -c "from rainbow_octopus.verifier import find_browser; assert find_browser()"
      - name: Run the full suite, including the host browser
        env:
          PYTHONPATH: src
        run: |
          set +e
          output="$(python -m unittest discover -s tests -v 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            failure_tail="$(printf '%s\n' "$output" | tail -n 45)"
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            printf '::error title=Portable browser suite failed::%s\n' "$failure_tail"
          fi
          exit "$status"
