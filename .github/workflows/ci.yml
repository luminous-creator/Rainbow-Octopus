name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v
      - name: Rehearse the pipeline offline
        env:
          PYTHONPATH: src
          ROCTO_HOME: ${{ runner.temp }}/rocto-home
        run: python scripts/dry_run.py all
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem dist\*.whl | Select-Object -First 1)
          rocto --version
          rocto --help

  portable-browser:
    name: Browser loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a discoverable host browser
        env:
          PYTHONPATH: src
        run: python -c "from rainbow_octopus.verifier import find_browser; assert find_browser()"
      - name: Run the full suite, including the host browser
        env:
          PYTHONPATH: src
        run: |
          set +e
          output="$(python -m unittest discover -s tests -v 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            failure_tail="$(printf '%s\n' "$output" | tail -n 22)"
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\n'/'%0A'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            printf '::error title=Portable browser suite failed::%s\n' "$failure_tail"
          fi
          exit "$status"

  container-as-root:
    # KI-009: Docker and most CI containers run as root, where Chromium will
    # not start without --no-sandbox, and the only browser is often the one
    # Playwright installed. This job is that environment.
    name: Browser loop (root container, Playwright Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Discover the Playwright browser as root
        env:
          PYTHONPATH: src
        run: |
          id -u
          python -c "from rainbow_octopus.verifier import find_browser, _sandbox_flags; b = find_browser(); print(b, _sandbox_flags()); assert b and '--no-sandbox' in _sandbox_flags()"
      - name: Run the full suite, including the real browser test
        env:
          PYTHONPATH: src
          ROCTO_HOME: /tmp/rocto-home
        run: python -m unittest discover -s tests -v
