# Publish every verified build under builds/ as one GitHub Pages site.
# Enable it once: Settings > Pages > Source: GitHub Actions.
name: Gallery

on:
  push:
    branches: [main]
    paths:
      - "builds/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rocto
        run: python -m pip install .
      - name: Build the gallery
        run: |
          mkdir -p builds
          rocto gallery builds --output _site --title "${GITHUB_REPOSITORY#*/} gallery"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
