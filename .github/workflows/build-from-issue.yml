# Label an issue `rocto:build` and get a pull request with the verified page.
#
# Security model (ADR-009):
# - Adding a label needs triage access, so the label is the approval step:
#   nobody outside the project can spend the API key by opening an issue.
# - Two jobs. `build` runs model-written code in a browser and holds the API
#   key but only a read-only token, with no git credentials on disk. `publish`
#   holds the write token but never runs generated code; it only commits
#   files the build job produced and verified.
# - Issue text reaches rocto only through environment variables read by
#   scripts/ci_build.py, never interpolated into a shell script.
name: Build from issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      idea:
        description: One-sentence idea to build
        required: true

permissions:
  contents: read

concurrency:
  group: rocto-build-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'rocto:build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.build.outputs.exit_code }}
      name: ${{ steps.build.outputs.name }}
      verdict: ${{ steps.build.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rocto
        run: python -m pip install .
      - name: Check prerequisites
        env:
          ROCTO_API_KEY: ${{ secrets.ROCTO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ROCTO_API_BASE: ${{ vars.ROCTO_API_BASE }}
          ROCTO_PLANNER: api
          ROCTO_EXECUTOR: deepseek
        run: |
          if [ -z "$ROCTO_API_KEY$DEEPSEEK_API_KEY" ]; then
            echo "::error title=No API key::Add a DEEPSEEK_API_KEY (or ROCTO_API_KEY) repository secret. See README > Automation."
            exit 1
          fi
          rocto doctor
      - name: Build and verify
        id: build
        env:
          ROCTO_API_KEY: ${{ secrets.ROCTO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ROCTO_API_BASE: ${{ vars.ROCTO_API_BASE }}
          ROCTO_DEEPSEEK_MODEL: ${{ vars.ROCTO_DEEPSEEK_MODEL }}
          ROCTO_PLANNER: api
          ROCTO_EXECUTOR: deepseek
          ROCTO_OUTPUT_ROOT: builds
          ROCTO_HOME: ${{ runner.temp }}/rocto-home
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_IDEA: ${{ inputs.idea }}
        run: python scripts/ci_build.py
      - name: Upload the build
        if: steps.build.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: rocto-build
          path: builds/${{ steps.build.outputs.name }}
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: build
    if: always() && needs.build.result == 'success' && needs.build.outputs.name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.build.outputs.name }}
      EXIT_CODE: ${{ needs.build.outputs.exit_code }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rocto
        run: python -m pip install .
      - uses: actions/download-artifact@v4
        with:
          name: rocto-build
          path: builds/${{ needs.build.outputs.name }}
      - name: Report a failed build on the issue
        if: needs.build.outputs.exit_code != '0'
        run: |
          rocto report "builds/$NAME" --format markdown > summary.md
          {
            echo "Rainbow Octopus could not produce a page that passes its checks (exit $EXIT_CODE)."
            echo
            cat summary.md
            echo
            echo "Logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > comment.md
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file comment.md
          else
            cat comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
      - name: Commit the verified build
        id: commit
        run: |
          branch="rocto/${NAME}"
          git config user.name "rainbow-octopus[bot]"
          git config user.email "rainbow-octopus[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # .rocto/ is ignored; publish only the state the gallery needs, not
          # the model transcripts in .rocto/logs/.
          git add "builds/$NAME"
          for file in run.json task.json contract-warnings.json; do
            if [ -f "builds/$NAME/.rocto/$file" ]; then
              git add -f "builds/$NAME/.rocto/$file"
            fi
          done
          git commit -m "Add verified build ${NAME}" -m "Built by Rainbow Octopus from ${ISSUE_NUMBER:+issue #$ISSUE_NUMBER}${ISSUE_NUMBER:-a manual run}."
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          shot="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SHA}/builds/${NAME}/screenshot.png?raw=true"
          rocto report "builds/$NAME" --format markdown --screenshot-url "$shot" > body.md
          {
            echo
            if [ -n "$ISSUE_NUMBER" ]; then echo "Closes #${ISSUE_NUMBER}"; fi
            echo
            echo "Open \`builds/${NAME}/index.html\` to try it, or \`report.html\` for every check."
          } >> body.md
          title="$(python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['title'][:100])" "builds/$NAME/.rocto/task.json")"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file body.md
            url="$(gh pr view "$existing" --json url --jq .url)"
          else
            url="$(gh pr create --head "$BRANCH" --title "Build: ${title}" --body-file body.md)"
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Built and verified: ${url}"
          fi
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
