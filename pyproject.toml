[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rainbow-octopus"
version = "0.1.0"
description = "Turn one sentence into a static web demo that is verified in a real browser before you see it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tian Yuan" }]
keywords = ["agent", "codex", "deepseek", "automation", "web"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luminous-creator/Rainbow-Octopus"
Repository = "https://github.com/luminous-creator/Rainbow-Octopus.git"
Issues = "https://github.com/luminous-creator/Rainbow-Octopus/issues"

[project.scripts]
rocto = "rainbow_octopus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
